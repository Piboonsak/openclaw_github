name: intake-sync

"on":
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to sync"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: intake-sync-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  sync:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.issue.labels.*.name), 'governance:intake')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install governance deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.21,<5" "PyYAML>=6.0,<7"

      - name: Parse intake body
        id: parse
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set +e
          python scripts/intake_to_state.py \
            --event "$GITHUB_EVENT_PATH" \
            --out .agent/state \
            --comment-output /tmp/intake-rework.md
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ $status -eq 0 ]; then
            python scripts/agent_state.py validate .agent/state/TASK-*.json || true
          fi
          exit 0

      - name: Post rework comment on validation failure
        if: steps.parse.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/intake-rework.md';
            if (!fs.existsSync(path)) {
              core.setFailed('intake_to_state.py failed without producing a comment file');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['needs-rework'],
            });
            core.setFailed('Intake validation failed.');

      - name: Commit state file on success
        if: steps.parse.outputs.status == '0'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .agent/state; then
            echo "No state changes to commit."
            exit 0
          fi
          BRANCH="intake/issue-${ISSUE_NUMBER}"
          git checkout -B "$BRANCH"
          git add .agent/state
          git commit -m "chore(state): sync TASK state from issue #${ISSUE_NUMBER}"
          git push --force --set-upstream origin "$BRANCH"

      - name: Open PR with state changes
        if: steps.parse.outputs.status == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.inputs?.issue_number;
            const branch = `intake/issue-${issueNumber}`;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (prs.length > 0) {
              core.notice(`Existing PR #${prs[0].number} updated.`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore(state): sync TASK state from issue #${issueNumber}`,
              head: branch,
              base: context.payload.repository.default_branch,
              body: `Auto-generated by intake-sync.yml from issue #${issueNumber}.\n\nReview the resulting \`.agent/state/TASK-*.json\` before merging.`,
              maintainer_can_modify: true,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['governance:state-sync'],
            });
            core.notice(`Opened PR #${pr.number}.`);
