name: BWCAcc — Deploy to UAT

# NOTE:
# - This workflow is an execution-plane mirror/break-glass path only.
# - Canonical deploy dispatch must be triggered from Openclaw control-plane workflows.
# - See Openclaw governance docs and docs/cicd/pipeline-design.md in this repo.

"on":
  workflow_dispatch:

# Only one UAT deploy at a time
concurrency:
  group: bwcacc-deploy-uat
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy BWCAcc UAT (Execution-Plane Mirror)
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SIT gate check (health + ready)
        env:
          SIT_URL: https://sit.yahwan.biz
          SIT_USER: ${{ secrets.BWCACC_SIT_BASIC_AUTH_USER }}
          SIT_PASS: ${{ secrets.BWCACC_SIT_BASIC_AUTH_PASS }}
        run: |
          set -euo pipefail

          if [ -z "${SIT_USER}" ] || [ -z "${SIT_PASS}" ]; then
            echo "Missing BWCACC_SIT_BASIC_AUTH_USER/BWCACC_SIT_BASIC_AUTH_PASS secrets"
            exit 1
          fi

          HEALTH_CODE=$(curl -sS -k -u "${SIT_USER}:${SIT_PASS}" -o /tmp/sit-health.json -w "%{http_code}" "${SIT_URL}/api/health")
          READY_CODE=$(curl -sS -k -u "${SIT_USER}:${SIT_PASS}" -o /tmp/sit-ready.json -w "%{http_code}" "${SIT_URL}/api/health/ready")

          echo "SIT /api/health HTTP ${HEALTH_CODE}"
          echo "SIT /api/health/ready HTTP ${READY_CODE}"

          if [ "${HEALTH_CODE}" != "200" ] || [ "${READY_CODE}" != "200" ]; then
            echo "SIT gate failed. UAT deploy is blocked until SIT passes."
            echo "--- /api/health ---"
            cat /tmp/sit-health.json || true
            echo "--- /api/health/ready ---"
            cat /tmp/sit-ready.json || true
            exit 1
          fi

      - name: Deploy to UAT VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BWCACC_UAT_HOST }}
          username: ${{ secrets.BWCACC_DEPLOY_USER }}
          key: ${{ secrets.BWCACC_VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/ledgerflow

            echo "=== Git Pull ==="
            git fetch origin uat
            git checkout uat
            git reset --hard origin/uat

            echo "=== Docker Build ==="
            docker compose -f docker/docker-compose.uat.yml build

            echo "=== Database Migration ==="
            docker compose -f docker/docker-compose.uat.yml run --rm backend \
              python -m alembic upgrade head

            echo "=== Docker Compose Up ==="
            docker compose -f docker/docker-compose.uat.yml up -d

            echo "=== Waiting for services (30s) ==="
            sleep 30

            echo "=== Health Check ==="
            bash scripts/deploy/health-check.sh "https://localhost/api/health" 6 10

      - name: Notify LINE — Success
        if: success()
        run: |
          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          MSG="✅ BWCAcc Deploy SUCCESS\nEnvironment: UAT (uat.bwcacc.biz)\nBranch: uat\nCommit: ${COMMIT_SHORT}\nHealth: /api/health → 200 OK\nTime: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.BWCACC_LINE_CHANNEL_ACCESS_TOKEN }}" \
            -d "{\"to\":\"${{ secrets.BWCACC_LINE_USER_ID }}\",\"messages\":[{\"type\":\"text\",\"text\":\"${MSG}\"}]}" \
            https://api.line.me/v2/bot/message/push || echo "LINE notify failed (non-fatal)"

      - name: Notify LINE — Failure
        if: failure()
        run: |
          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          MSG="❌ BWCAcc Deploy FAILED\nEnvironment: UAT (uat.bwcacc.biz)\nBranch: uat\nCommit: ${COMMIT_SHORT}\nAction: Check logs at github.com/YAHWAN-SHOP/ai-accounting-copilot/actions\nTime: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.BWCACC_LINE_CHANNEL_ACCESS_TOKEN }}" \
            -d "{\"to\":\"${{ secrets.BWCACC_LINE_USER_ID }}\",\"messages\":[{\"type\":\"text\",\"text\":\"${MSG}\"}]}" \
            https://api.line.me/v2/bot/message/push || echo "LINE notify failed (non-fatal)"
