version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ai-copilot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: ai_accounting_sit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-copilot-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Local S3 Mock
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: ai-copilot-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
      target: development
    container_name: ai-copilot-api
    environment:
      STAGE: SIT
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/ai_accounting_sit
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ai-accounting-sit
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      OCR_SERVICE: tesseract
      LLM_PROVIDER: anthropic
      LLM_MODEL: claude-3-5-haiku-20241022
      MAX_TOKENS_PER_INVOICE: 1500
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ../src/frontend
      dockerfile: ../../docker/Dockerfile.frontend
    container_name: ai-copilot-ui
    environment:
      REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../src/frontend:/app
    depends_on:
      - backend

  # Celery worker for async pipeline jobs
  celery-worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
      target: development
    container_name: ai-copilot-celery-worker
    command: celery -A src.backend.workers.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/ai_accounting_sit
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery beat scheduler (used by TASK-807 retention jobs)
  celery-beat:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
      target: development
    container_name: ai-copilot-celery-beat
    command: celery -A src.backend.workers.celery_app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/ai_accounting_sit
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
