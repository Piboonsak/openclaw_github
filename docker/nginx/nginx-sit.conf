# nginx SIT configuration — sit.yahwan.biz
# Internal-only gate for engineering/testing traffic before UAT.

server {
    listen 80;
    server_name sit.yahwan.biz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sit.yahwan.biz;

    ssl_certificate     /etc/letsencrypt/live/sit.yahwan.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sit.yahwan.biz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # SIT must not be public-indexed.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Customer-facing app routes use app login only (no browser Basic Auth popup).
    # Keep Basic Auth available only under explicit internal paths.

    location ^~ /_internal/ {
        auth_basic "LedgerFlow SIT Internal";
        auth_basic_user_file /etc/nginx/.htpasswd;
        return 404;
    }

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
