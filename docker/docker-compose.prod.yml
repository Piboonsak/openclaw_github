# Docker Compose — PROD Environment (app.bwcacc.biz)
# TASK-1308 | Target: VPS 72.62.247.9 (KVM 4: 4 vCPU, 16 GB)
#
# Usage:
#   docker compose -f docker/docker-compose.prod.yml up -d
#   docker compose -f docker/docker-compose.prod.yml --profile worker up -d  # include celery
#
# Pre-requisites (run on VPS before first deploy):
#   1. Copy docker/.env.prod.example → docker/.env.prod and fill secrets
#   2. Remove nginx-gate container:
#        docker rm -f nginx-gate
#   3. Update certbot renewal hooks (nginx-gate → ledgerflow-nginx):
#        sed -i 's/nginx-gate/ledgerflow-nginx/g' /etc/letsencrypt/renewal/app.bwcacc.biz.conf
#
# PROD Safety (see docs/cicd/prod-safety-rules.md):
#   - Always run DB snapshot before migration
#   - Health check must pass before marking deploy successful
#   - Rollback procedure documented in prod-safety-rules.md

version: '3.8'

services:
  # ── nginx — SSL termination, reverse proxy ──────────────────
  # Only service with host port binding (80/443)
  nginx:
    image: nginx:1.27-alpine
    container_name: ledgerflow-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ledgerflow-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M

  # ── Backend — FastAPI (uvicorn, 4 workers) ──────────────────
  # TODO: Switch to gunicorn when added to requirements.txt:
  #   ["gunicorn", "src.backend.app.main:app", "-w", "4",
  #    "-k", "uvicorn.workers.UvicornWorker", "-b", "0.0.0.0:8000"]
  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
      target: production
    container_name: ledgerflow-backend
    restart: always
    command:
      [
        "python", "-m", "uvicorn",
        "src.backend.app.main:app",
        "--host", "0.0.0.0",
        "--port", "8000",
        "--workers", "4"
      ]
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      STAGE: Prod
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ledgerflow-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 1G

  # ── Celery Worker — background OCR + LLM processing ────────
  # Activate with: --profile worker
  # Requires: celery in requirements.txt + src.backend.worker module
  celery-worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
      target: production
    container_name: ledgerflow-celery-worker
    restart: on-failure
    command:
      [
        "python", "-m", "celery",
        "-A", "src.backend.worker.app",
        "worker",
        "--loglevel=warning",
        "--concurrency=3"
      ]
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      STAGE: Prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ledgerflow-net
    profiles:
      - worker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3G
        reservations:
          memory: 1536M

  # ── Celery Beat — task scheduler ────────────────────────────
  # Activate with: --profile worker
  celery-beat:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
      target: production
    container_name: ledgerflow-celery-beat
    restart: on-failure
    command:
      [
        "python", "-m", "celery",
        "-A", "src.backend.worker.app",
        "beat",
        "--loglevel=warning"
      ]
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      STAGE: Prod
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ledgerflow-net
    profiles:
      - worker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          memory: 64M

  # ── PostgreSQL 16 ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ledgerflow-postgres
    restart: always
    env_file:
      - .env.prod
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledgerflow-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 4G
        reservations:
          memory: 2G

  # ── Redis 7 ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ledgerflow-redis
    restart: always
    command:
      [
        "redis-server",
        "--maxmemory", "400mb",
        "--maxmemory-policy", "allkeys-lru",
        "--appendonly", "yes"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledgerflow-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          memory: 256M

  # ── MinIO — S3-compatible object storage ────────────────────
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: ledgerflow-minio
    restart: always
    env_file:
      - .env.prod
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':>/dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledgerflow-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          memory: 512M

# ── Networks ──────────────────────────────────────────────────
networks:
  ledgerflow-net:
    driver: bridge

# ── Volumes (Docker-managed, persistent) ──────────────────────
volumes:
  pg_data:
  redis_data:
  minio_data:
