journal_entry_rules:
- rule_id: JE001
  name: บันทึกขายเงินเชื่อ
  description: การบันทึกการขายเงินเชื่อโดยไม่ต้องทำรายงานสินค้า
  document_types:
  - Invoice
  transaction_type: Sale
  book_code: Revenue
  conditions: {}
  entries:
  - side: debit
    account_code: 1130-01
    account_name: ลูกหนี้การค้า
    amount_field: amount
    description: บันทึกลูกหนี้จากการขายเงินเชื่อ
  - side: credit
    account_code: 4100-01
    account_name: รายได้รับจ้าง
    amount_field: amount
    description: บันทึกรายได้จากการขายเงินเชื่อ
  - side: credit
    account_code: 2136-00
    account_name: ภาษีขาย-รอเรียกเก็บ
    amount_field: tax_amount
    description: บันทึกภาษีขายรอเรียกเก็บ
  validation:
    balance_check: debit == credit
    formula: amount + tax_amount
- rule_id: JE002
  name: บันทึกรับชำระ
  description: การบันทึกการรับชำระจากลูกหนี้
  document_types:
  - Receipt
  transaction_type: Payment
  book_code: Cash
  conditions: {}
  entries:
  - side: debit
    account_code: 1113-01
    account_name: เงินฝากออมทรัพย์
    amount_field: amount
    description: บันทึกการรับชำระจากลูกหนี้
  - side: credit
    account_code: 1130-01
    account_name: ลูกหนี้การค้า
    amount_field: amount
    description: ลดลูกหนี้การค้า
  - side: credit
    account_code: 2135-00
    account_name: ภาษีขาย
    amount_field: tax_amount
    description: บันทึกภาษีขาย
  validation:
    balance_check: debit == credit
    formula: amount + tax_amount
- rule_id: JE003
  name: บันทึกซื้อวัสดุอุปกรณ์
  description: การบันทึกการซื้อวัสดุอุปกรณ์
  document_types:
  - Purchase Order
  transaction_type: Purchase
  book_code: Expense
  conditions: {}
  entries:
  - side: debit
    account_code: 5130-01
    account_name: วัสดุอุปกรณ์(ทั่วไป)
    amount_field: amount
    description: บันทึกการซื้อวัสดุอุปกรณ์
  - side: credit
    account_code: 2120-01
    account_name: เจ้าหนี้การค้า
    amount_field: amount
    description: บันทึกเจ้าหนี้การค้า
  - side: debit
    account_code: 1154-00
    account_name: ภาษีซื้อ
    amount_field: tax_amount
    description: บันทึกภาษีซื้อ
  validation:
    balance_check: debit == credit
    formula: amount + tax_amount
- rule_id: JE004
  name: บันทึกค่าใช้จ่าย (สด)
